name: subtrans
description: "SubTrans — YouTube video subtitles translated into 130+ languages."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  # Native playback (ExoPlayer) fed with direct stream URLs — plays EVERY
  # video, including ones whose owner disabled embedding (no iframe at all).
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SubSans
      fonts:
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
        - asset: fonts/InterDisplay-Regular.ttf
          weight: 400
        - asset: fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: fonts/InterDisplay-ExtraBold.ttf
          weight: 800
