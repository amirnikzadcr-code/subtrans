name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        working-directory: app
        run: flutter create . --platforms=android --org com.subtrans --project-name subtrans

      - name: Remove generated boilerplate test
        working-directory: app
        run: rm -rf test

      - name: Patch Android manifest (INTERNET + label)
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $M || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="subtrans"|android:label="SubTrans"|' $M

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Copy APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/SubTrans-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtrans-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SubTrans v1.0.${{ github.run_number }}
          body: |
            ## SubTrans — YouTube subtitle translation (130+ languages)

            **What's new**
            - 🎬 Plays EVERY video in-app now — switched to the exact playback stack of the original app (YouTube IFrame player served from youtube-nocookie.com origin). "Watch on YouTube" / "embedding disabled" errors are gone.
            - Fullscreen mode (rotate or tap the button), scrub bar, mute, auto-hiding controls
            - Synced translated subtitles burned on top of the video
            - Tap any transcript line to seek the video

            **Install**: download `SubTrans-v*.apk`, allow "install unknown apps", install.
            Requires YouTube access (VPN in restricted regions).
          files: dist/*.apk
          make_latest: true
